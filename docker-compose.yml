services:
  db:
    image: postgres:16
    container_name: job-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - job-tracker-db-data:/var/lib/postgresql/data

  db-test:
    image: postgres:16
    container_name: job-tracker-db-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_tracker_test
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  job-tracker-db-data:
